        HOW TO ADD A PHOTO
        1. Format: JPEG (.jpg) or WebP (.webp), about 2000px on the longest side
           and under ~500KB. Resize/compress first (e.g. squoosh.app, quality 80-85).
           Use lowercase file names with no spaces, e.g. lisbon-sunset.jpg
        2. Upload the file to the images/art/ folder.
        3. Copy the <figure> block below inside <div class="gallery">, change the
           file name, and write the caption between <figcaption> and </figcaption>.
           "alt" describes the photo for screen readers; the caption is what visitors see.
        4. Once you have photos, delete the "Travel photographs coming soon." line above.

        <figure>
          <img src="images/art/lisbon-sunset.jpg" alt="Sunset over Lisbon rooftops" loading="lazy" decoding="async">
          <figcaption>Lisbon, August 2025</figcaption>
        </figure>
